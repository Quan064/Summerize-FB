<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Popup</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <div class="header">
            <h2>Đoạn chat</h2>
            <div class="icons">
                <span>⚙</span>
            </div>
        </div>
        <div class="chat-list">
            <!-- Danh sách tin nhắn sẽ được thêm vào đây -->
        </div>
        <div class="input-container">
            <i class="fa-regular fa-bookmark input-icon"></i>
            <input type="text" id="Input" placeholder='Content'>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
